<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OnePulso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Arapey&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;}
  body{background:radial-gradient(1200px 600px at 50% -10%,#efeaff,#f7f6fc);color:#141319;font-family:"Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  *{box-sizing:border-box;}
  a{text-decoration:none;color:inherit;}
  .card{background:#fff;border:1px solid #edeaf7;border-radius:18px;padding:22px;box-shadow:0 12px 30px rgba(122,90,248,.06);transition:transform .18s,box-shadow .18s;display:block;}
  .card:hover{transform:translateY(-3px);box-shadow:0 20px 44px rgba(122,90,248,.14);}
</style>
</head>
<body>
  <div style="width:100%;max-width:720px;">
    <img src="assets/logo-onepulso.png" alt="onepulso" style="height:34px;display:block;margin:0 auto 26px;">
    <h1 style="text-align:center;margin:0 0 6px;font-size:26px;font-weight:400;letter-spacing:-.02em;">Plataforma OnePulso</h1>
    <p style="text-align:center;margin:0 0 28px;font-size:14px;font-weight:300;color:#8b8699;">Prototipos internos · cold email &amp; seguimiento</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
      <a class="card" href="Plataforma.html">
        <div style="width:42px;height:42px;border-radius:12px;background:#ece7ff;color:#5b3ad9;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:14px;">◫</div>
        <div style="font-size:17px;font-weight:500;margin-bottom:4px;">Plataforma</div>
        <div style="font-size:13px;font-weight:300;color:#8b8699;line-height:1.5;">Panel de clientes, follow-ups, tareas y resumen de campañas.</div>
      </a>
      <a class="card" href="Seguimiento.html">
        <div style="width:42px;height:42px;border-radius:12px;background:#ece7ff;color:#5b3ad9;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:14px;">✉</div>
        <div style="font-size:17px;font-weight:500;margin-bottom:4px;">Seguimiento</div>
        <div style="font-size:13px;font-weight:300;color:#8b8699;line-height:1.5;">Importa conversaciones y programa follow-ups en un calendario con arrastrar y soltar.</div>
      </a>
    </div>
  </div>
</body>
</html>
