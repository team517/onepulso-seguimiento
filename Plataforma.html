<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OnePulso · Plataforma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=Arapey&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
  html, body { margin:0; height:100%; }
  body { background:#f7f6fc; color:#141319; font-family:"Inter", system-ui, -apple-system, sans-serif; -webkit-font-smoothing:antialiased; }
  * { box-sizing:border-box; }
  a { color:#7a5af8; text-decoration:none; }
  a:hover { color:#6a48e8; }
  ::selection { background:#ece7ff; }
  .display-num { font-family:"Arapey", Georgia, serif; font-weight:400; }
  button { font-family:inherit; }
  input, select { font-family:inherit; }
  .op-scroll::-webkit-scrollbar { width:9px; }
  .op-scroll::-webkit-scrollbar-thumb { background:#e3ddf2; border-radius:99px; }

  /* hover / focus states ported from the design's style-hover / style-focus */
  .op-search:focus { border-color:#7a5af8 !important; box-shadow:0 0 0 3px rgba(122,90,248,0.13); }
  .op-new:hover { background:#6a48e8 !important; }
  .op-followadv:hover { background:#f4f2ff !important; border-color:#d9d3f3 !important; }
  .op-taskadv:hover { background:#f4f2ff !important; }
  .op-nav:hover { background:#f2effc; }

  /* --- Seguimiento module --- */
  .seg-ev { cursor:grab; }
  .seg-ev:active { cursor:grabbing; }
  .seg-ev.dragging { opacity:.35; }
  .seg-day.drop-hot { background:#f0ebff !important; outline:2px dashed #b9a7fb; outline-offset:-2px; }
  .seg-conv:hover { background:#faf9ff !important; }
  .seg-day:hover { background:#faf9ff; }
  .seg-in:focus { border-color:#7a5af8 !important; box-shadow:0 0 0 3px rgba(122,90,248,0.13); }
  .seg-primary:hover { background:#6a48e8 !important; }
  .seg-ghost:hover { background:#f4f2ff !important; border-color:#d9d3f3 !important; }
  .seg-drawer { transition:transform .28s cubic-bezier(.4,0,.2,1); }
  .seg-scroll::-webkit-scrollbar { width:9px; height:9px; }
  .seg-scroll::-webkit-scrollbar-thumb { background:#e3ddf2; border-radius:99px; }

  /* --- Horario module --- */
  .hor-drag { cursor:grab; }
  .hor-drag:active { cursor:grabbing; }
  .hor-daycol.hor-hot { background-color:#f4f2ff !important; }
  .hor-unschedzone.hor-hot { outline:2px dashed #b9a7fb; outline-offset:-4px; }
  .hor-block:hover { box-shadow:0 5px 14px rgba(122,90,248,0.18) !important; }
  .hor-unsched:hover { border-color:#d9d3f3 !important; background:#f7f5ff !important; }

  /* --- Landing / login --- */
  .auth-shell { display:grid; grid-template-columns:1.1fr 0.9fr; min-height:100vh; }
  @media (max-width:820px){ .auth-shell { grid-template-columns:1fr !important; } .auth-hero { display:none !important; } }

  @media (max-width: 900px){ .op-shell { grid-template-columns:1fr !important; } .op-side { display:none !important; } .op-grid4 { grid-template-columns:repeat(2,1fr) !important; } .op-two { grid-template-columns:1fr !important; } .op-kanban { grid-template-columns:1fr !important; } .seg-grid { grid-template-columns:1fr !important; } .seg-drawer { width:100vw !important; } }
  @media (max-width: 560px){ .op-grid4 { grid-template-columns:1fr !important; } }
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";
(function () {
  // ---- helpers ----------------------------------------------------------
  var esc = function (s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };

  var PILL = function (bg, fg) {
    return "display:inline-flex; align-items:center; padding:5px 11px; border-radius:99px; font-size:12.5px; font-weight:400; background:" + bg + "; color:" + fg + ";";
  };
  var STATUS_PILL = { "Activo": PILL("#e4f7ed", "#12784a"), "Onboarding": PILL("#ece7ff", "#5b3ad9"), "Pausa": PILL("#fdf0e3", "#a2670f"), "Renovación": PILL("#e6f1ff", "#1f5bb5") };
  var FOLLOW_PILL = { "Pendiente": PILL("#fdf0e3", "#a2670f"), "Enviado": PILL("#ece7ff", "#5b3ad9"), "Respondido": PILL("#e4f7ed", "#12784a"), "Cerrado": PILL("#f1f0f5", "#6f6a83") };
  var PRIO_PILL = { "Alta": PILL("#fdeaef", "#b0234c"), "Media": PILL("#ece7ff", "#5b3ad9"), "Baja": PILL("#f1f0f5", "#6f6a83") };
  var FOLLOW_ORDER = ["Pendiente", "Enviado", "Respondido", "Cerrado"];
  var TASK_ORDER = ["Por hacer", "En curso", "Hecho"];

  // ---- Horario (schedule) helpers ---------------------------------------
  var DAY = 86400000, HOUR = 3600000;
  var MES_ES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  var HOR_FIRST = 8, HOR_LAST = 20, HOR_ROWH = 46;
  var PRIO_BLOCK = { "Alta": ["#fdeaef","#b0234c"], "Media": ["#ece7ff","#5b3ad9"], "Baja": ["#e9f7ef","#1a9d54"] };
  // Paleta de colores para los bloques del horario ([fondo, color])
  var COLORS = { violet: ["#ece7ff","#7a5af8"], blue: ["#e4edff","#2f6bd6"], green: ["#e2f6ea","#12a150"], amber: ["#fdf1dc","#c47d10"], red: ["#fdeaef","#d63864"], teal: ["#ddf5f2","#0f9b8e"], pink: ["#fceaf5","#c23e8f"] };
  var COLOR_ORDER = ["violet","blue","green","amber","red","teal","pink"];
  function taskColorKey(t, idx){ return (t && t.color) || COLOR_ORDER[idx % COLOR_ORDER.length]; }
  var _brk = 0; function brkId(){ return "brk" + (++_brk); }
  function dayStartP(ms){ var d = new Date(ms); d.setHours(0,0,0,0); return d.getTime(); }
  function mondayOf(ms){ var d = new Date(ms); var wd = (d.getDay()+6)%7; d.setHours(0,0,0,0); return d.getTime() - wd*DAY; }

  // ---- state ------------------------------------------------------------
  var state = {
    view: "dash",
    query: "",
    followFilter: "Todos",
    toast: "",
    weekStart: mondayOf(Date.now()),
    quickAdd: null,
    horFrom: 8,
    horTo: 20,
    franjaOpen: false,
    franjaDraft: null,
    breaks: [],
    avail: null,
    availOpen: false,
    availDraft: null,
    logo: null,
    persoOpen: false,
    clients: [
      { name: "Vitalis Health", sector: "Salud digital", owner: "Xavier F.", meetings: 24, leads: 412, status: "Activo" },
      { name: "Bloom Studio", sector: "Audiovisual", owner: "Marta R.", meetings: 17, leads: 268, status: "Activo" },
      { name: "Cedra Talent", sector: "RRHH", owner: "Xavier F.", meetings: 9, leads: 154, status: "Onboarding" },
      { name: "Nordic Fintech", sector: "Fintech", owner: "Luis P.", meetings: 31, leads: 520, status: "Renovación" },
      { name: "Alma Legal", sector: "Legal B2B", owner: "Marta R.", meetings: 6, leads: 98, status: "Pausa" },
      { name: "Ridge Logistics", sector: "Logística", owner: "Luis P.", meetings: 21, leads: 347, status: "Activo" },
      { name: "Kora Analytics", sector: "SaaS datos", owner: "Xavier F.", meetings: 13, leads: 221, status: "Onboarding" }
    ],
    follows: [
      { contact: "María Serrano", company: "Vitalis Health", subject: "Propuesta Q3", step: "Follow-up 2/4", due: "Hoy · 11:00", state: "Pendiente", icon: "✉" },
      { contact: "Jordi Puig", company: "Nordic Fintech", subject: "Renovación anual", step: "Follow-up 1/3", due: "Hoy · 16:30", state: "Enviado", icon: "✦" },
      { contact: "Elena Ruiz", company: "Bloom Studio", subject: "Casos de éxito", step: "Follow-up 3/4", due: "Mañana", state: "Respondido", icon: "◎" },
      { contact: "Tomás Vidal", company: "Cedra Talent", subject: "Kickoff campaña", step: "Follow-up 1/4", due: "28 jul", state: "Pendiente", icon: "✉" },
      { contact: "Nuria Camps", company: "Ridge Logistics", subject: "Ampliar buzones", step: "Follow-up 2/3", due: "29 jul", state: "Enviado", icon: "✦" },
      { contact: "Iván Costa", company: "Kora Analytics", subject: "Revisión copy", step: "Follow-up 4/4", due: "30 jul", state: "Cerrado", icon: "◎" }
    ],
    tasks: [
      { title: "Validar 800 leads del ICP de Vitalis", client: "Vitalis Health", who: "MR", due: "Hoy", priority: "Alta", state: "Por hacer" },
      { title: "Escribir secuencia A/B para Cedra", client: "Cedra Talent", who: "XF", due: "Hoy", priority: "Alta", state: "Por hacer" },
      { title: "Calentar 6 buzones nuevos", client: "Ridge Logistics", who: "LP", due: "28 jul", priority: "Media", state: "Por hacer" },
      { title: "Revisar reputación de dominios", client: "Nordic Fintech", who: "LP", due: "Hoy", priority: "Alta", state: "En curso" },
      { title: "Preparar informe mensual", client: "Bloom Studio", who: "MR", due: "29 jul", priority: "Media", state: "En curso" },
      { title: "Actualizar ICP tras feedback", client: "Kora Analytics", who: "XF", due: "31 jul", priority: "Baja", state: "En curso" },
      { title: "Agendar discovery con Alma Legal", client: "Alma Legal", who: "XF", due: "24 jul", priority: "Media", state: "Hecho" },
      { title: "Migrar respuestas al CRM", client: "Vitalis Health", who: "LP", due: "23 jul", priority: "Baja", state: "Hecho" }
    ]
  };

  // El horario empieza vacío: tú pones las horas (arrastrando o escribiendo en el calendario).
  state.avail = defaultAvail();
  computeHours();

  var toastTimer = null;
  function flash(msg) {
    clearTimeout(toastTimer);
    state.toast = msg;
    renderToast();
    toastTimer = setTimeout(function () { state.toast = ""; renderToast(); }, 1900);
  }

  function navStyle(active) {
    return "display:flex; align-items:center; gap:11px; width:100%; text-align:left; padding:11px 13px; border-radius:12px; border:none; cursor:pointer; font-size:14.5px; letter-spacing:-0.01em; transition:background .18s;"
      + (active ? "background:#f2effc; color:#5b3ad9; font-weight:500;" : "background:transparent; color:#57565f; font-weight:300;");
  }

  function matches(text) {
    var q = state.query.trim().toLowerCase();
    return !q || text.toLowerCase().indexOf(q) !== -1;
  }

  // ---- actions ----------------------------------------------------------
  function advanceFollow(i) {
    var cur = FOLLOW_ORDER.indexOf(state.follows[i].state);
    var next = FOLLOW_ORDER[Math.min(cur + 1, FOLLOW_ORDER.length - 1)];
    state.follows[i] = Object.assign({}, state.follows[i], { state: next });
    render();
    flash(state.follows[i].contact + " → " + next);
  }

  function advanceTask(idx) {
    var t = state.tasks[idx];
    var next = TASK_ORDER[Math.min(TASK_ORDER.indexOf(t.state) + 1, 2)];
    state.tasks[idx] = Object.assign({}, t, { state: next });
    render();
    flash("Tarea movida");
  }

  function newTask(extra) {
    var t = Object.assign({ title: "Nueva tarea", client: "—", who: "XF", due: "", priority: "Media", state: "Por hacer" }, extra || {});
    state.tasks.push(t);
    return state.tasks.length - 1;
  }
  function drawScheduleCanvas(T, done) {
    var first = state.horFrom, last = state.horTo, rowH = 46, gut = 56, colW = 150, headH = 54, titleH = 42, pad = 12;
    var totalH = (last - first) * rowH, W = gut + 7 * colW, H = T + titleH + headH + totalH + pad;
    var c = document.createElement("canvas"); c.width = W; c.height = H;
    var x = c.getContext("2d");
    x.fillStyle = "#ffffff"; x.fillRect(0, 0, W, H);
    var ws = state.weekStart, a = new Date(ws), b = new Date(ws + 6 * DAY);
    var range = a.getDate() + "–" + b.getDate() + " " + MES_ES[b.getMonth()] + " " + b.getFullYear();
    function paint() {
      x.fillStyle = "#141319"; x.font = "600 20px Inter, Arial, sans-serif"; x.textAlign = "left";
      x.fillText("Horario semanal · " + range, 16, T + 28);
      var dayNames = ["LUN", "MAR", "MIÉ", "JUE", "VIE", "SÁB", "DOM"], gridTop = T + titleH + headH;
      for (var i = 0; i < 7; i++) {
        var cx = gut + i * colW;
        x.textAlign = "center"; x.fillStyle = "#a8a3b8"; x.font = "600 11px Inter, Arial, sans-serif";
        x.fillText(dayNames[i], cx + colW / 2, T + titleH + 22);
        x.fillStyle = "#141319"; x.font = "400 18px Georgia, serif";
        x.fillText(String(new Date(ws + i * DAY).getDate()), cx + colW / 2, T + titleH + 44);
      }
      x.textAlign = "left";
      for (var d = 0; d < 7; d++) {
        var colx = gut + d * colW, av = state.avail ? state.avail[d] : null;
        x.fillStyle = "#f6f4fa"; x.fillRect(colx, gridTop, colW, totalH);
        if (av && av.enabled) av.ranges.forEach(function (r) {
          var t0 = (Math.max(first, r.from) - first) * rowH, hh = (Math.min(last, r.to) - Math.max(first, r.from)) * rowH;
          if (hh > 0) { x.save(); x.globalAlpha = 0.5; x.fillStyle = COLORS[av.color || "violet"][1]; x.fillRect(colx, gridTop + t0, colW, hh); x.restore(); }
        });
      }
      x.font = "400 11px Inter, Arial, sans-serif";
      for (var h = first; h <= last; h++) {
        var yy = gridTop + (h - first) * rowH;
        x.strokeStyle = "#eeecf5"; x.beginPath(); x.moveTo(gut, yy + 0.5); x.lineTo(W, yy + 0.5); x.stroke();
        x.fillStyle = "#a8a3b8"; x.fillText((h < 10 ? "0" : "") + h + ":00", 10, yy + 4);
      }
      for (var s = 0; s <= 7; s++) { var sx = gut + s * colW; x.strokeStyle = "#e7e2f5"; x.beginPath(); x.moveTo(sx + 0.5, gridTop); x.lineTo(sx + 0.5, gridTop + totalH); x.stroke(); }
      state.breaks.forEach(function (bk) {
        var di = Math.floor((dayStartP(bk.start) - ws) / DAY); if (di < 0 || di > 6) return;
        var sh = new Date(bk.start).getHours(), dur = bk.durH || 1;
        var bx = gut + di * colW + 3, by = gridTop + (sh - first) * rowH + 2, bh = dur * rowH - 4;
        x.fillStyle = "#e5e2ee"; x.fillRect(bx, by, colW - 6, bh);
        x.fillStyle = "#6f6a83"; x.font = "600 11px Inter, Arial, sans-serif"; x.fillText("Descanso: " + bk.label, bx + 6, by + 15);
      });
      state.tasks.forEach(function (t, idx) {
        if (t.start == null) return;
        var di = Math.floor((dayStartP(t.start) - ws) / DAY); if (di < 0 || di > 6) return;
        var sh = new Date(t.start).getHours(), dur = t.durH || 1, pc = COLORS[taskColorKey(t, idx)];
        var bx = gut + di * colW + 3, by = gridTop + (sh - first) * rowH + 2, bw = colW - 6, bh = dur * rowH - 4;
        x.fillStyle = pc[0]; x.fillRect(bx, by, bw, bh);
        x.fillStyle = pc[1]; x.fillRect(bx, by, 3, bh);
        x.fillStyle = pc[1]; x.font = "600 10px Inter, Arial, sans-serif"; x.fillText((sh < 10 ? "0" : "") + sh + ":00", bx + 7, by + 13);
        x.fillStyle = "#141319"; x.font = "500 12px Inter, Arial, sans-serif";
        x.fillText(t.title.length > 19 ? t.title.slice(0, 18) + "…" : t.title, bx + 7, by + 28);
      });
      done(c, range);
    }
    if (T > 0 && state.logo) {
      var img = new Image();
      img.onload = function () { var lh = Math.min(50, T - 14); var lw = img.width * (lh / img.height); x.drawImage(img, 16, 12, lw, lh); paint(); };
      img.onerror = function () { paint(); };
      img.src = state.logo;
    } else paint();
  }
  function downloadSchedule() {
    var T = state.logo ? 74 : 0;
    drawScheduleCanvas(T, function (canvas, range) {
      var imgData = canvas.toDataURL("image/png");
      var J = window.jspdf && window.jspdf.jsPDF;
      if (!J) {
        var l = document.createElement("a"); l.href = imgData; l.download = "horario-" + range.replace(/\s+/g, "-") + ".png";
        document.body.appendChild(l); l.click(); document.body.removeChild(l); flash("Horario descargado (PNG)"); return;
      }
      var pdf = new J({ orientation: canvas.width >= canvas.height ? "l" : "p", unit: "px", format: [canvas.width, canvas.height], compress: true });
      pdf.addImage(imgData, "PNG", 0, 0, canvas.width, canvas.height);
      pdf.save("horario-" + range.replace(/\s+/g, "-") + ".pdf");
      flash("Horario descargado (PDF)");
    });
  }
  function onLogoFile(file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function (ev) {
      var img = new Image();
      img.onload = function () {
        var maxW = 400, sc = Math.min(1, maxW / img.width), cw = Math.round(img.width * sc), ch = Math.round(img.height * sc);
        var cv = document.createElement("canvas"); cv.width = cw; cv.height = ch;
        cv.getContext("2d").drawImage(img, 0, 0, cw, ch);
        state.logo = cv.toDataURL("image/png");
        render(); flash("Logo añadido");
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }
  function horHourFromY(col, clientY) {
    var r = col.getBoundingClientRect();
    var h = state.horFrom + Math.floor((clientY - r.top) / HOR_ROWH);
    return Math.max(state.horFrom, Math.min(state.horTo - 1, h));
  }
  function defaultAvail() {
    var a = [];
    for (var i = 0; i < 7; i++) {
      if (i <= 4) a.push({ enabled: true, color: COLOR_ORDER[i % COLOR_ORDER.length], ranges: [{ from: 10, to: 13 }, { from: 15, to: 19 }] });
      else a.push({ enabled: false, color: COLOR_ORDER[i % COLOR_ORDER.length], ranges: [] });
    }
    return a;
  }
  function computeHours() {
    var mn = 24, mx = 0, any = false;
    (state.avail || []).forEach(function (a) { if (a.enabled) a.ranges.forEach(function (r) { if (r.to > r.from) { any = true; if (r.from < mn) mn = r.from; if (r.to > mx) mx = r.to; } }); });
    if (!any) { state.horFrom = 8; state.horTo = 20; }
    else { state.horFrom = mn; state.horTo = (mx <= mn ? mn + 1 : mx); }
  }
  function quickAddCreate() {
    var qa = state.quickAdd; if (!qa) return;
    var el = document.getElementById("op-qa-input"); if (el) qa.text = el.value;
    var title = (qa.text || "").trim();
    if (qa.kind === "break" && qa.day != null) {
      state.breaks.push({ id: brkId(), start: qa.day + qa.hour * HOUR, durH: 1, label: title || "Descanso" });
      state.quickAdd = null; render();
      flash("Descanso añadido · " + (qa.hour < 10 ? "0" : "") + qa.hour + ":00"); return;
    }
    if (!title) { flash("Escribe un nombre para la tarea"); return; }
    var extra = { title: title, client: "—", who: "XF", priority: "Media", color: qa.color || "violet" };
    if (qa.day != null) { extra.start = qa.day + qa.hour * HOUR; extra.durH = 1; }
    newTask(extra);
    state.quickAdd = null; render();
    flash(qa.day != null ? ("Añadida «" + title + "» · " + (qa.hour < 10 ? "0" : "") + qa.hour + ":00") : ("Añadida «" + title + "» — arrástrala al horario"));
  }

  // ---- derived view model (mirrors renderVals) --------------------------
  function vals() {
    var s = state;
    var pendientes = s.follows.filter(function (f) { return f.state === "Pendiente"; }).length;
    var abiertas = s.tasks.filter(function (t) { return t.state !== "Hecho"; }).length;

    var views = [
      { id: "dash", label: "Resumen", icon: "◫", count: "" },
      { id: "clients", label: "Clientes", icon: "◍", count: s.clients.length },
      { id: "seg", label: "Seguimiento", icon: "✉", count: "" },
      { id: "horario", label: "Horario", icon: "◷", count: "" },
      { id: "tasks", label: "Tareas", icon: "✓", count: abiertas }
    ];

    var heads = {
      dash: ["Resumen", "Estado general de las campañas · julio 2026"],
      clients: ["Clientes", s.clients.length + " cuentas activas en la plataforma"],
      seg: ["Seguimiento", "Conversaciones y follow-ups en tu calendario"],
      horario: ["Horario", "Tu semana · arrastra tareas para ponerles hora"],
      tasks: ["Tareas", abiertas + " tareas abiertas en el equipo"]
    };

    var maxMeet = Math.max.apply(null, s.clients.map(function (c) { return c.meetings; }));

    var filteredFollows = s.follows
      .map(function (f, i) { return Object.assign({ i: i }, f); })
      .filter(function (f) { return (s.followFilter === "Todos" || f.state === s.followFilter) && matches(f.contact + " " + f.company + " " + f.subject); });

    return {
      title: heads[s.view][0],
      subtitle: heads[s.view][1],
      query: s.query,
      toast: s.toast,
      isDash: s.view === "dash",
      isClients: s.view === "clients",
      isSeg: s.view === "seg",
      isHorario: s.view === "horario",
      isTasks: s.view === "tasks",

      nav: views.map(function (v) {
        return {
          id: v.id,
          label: v.label,
          icon: v.icon,
          count: v.count,
          style: navStyle(s.view === v.id),
          badgeStyle: v.count === "" ? "display:none;" : "margin-left:auto; font-size:12px; font-weight:400; color:#8b8699; background:#f4f2ff; padding:2px 8px; border-radius:99px;"
        };
      }),

      kpis: [
        { label: "Reuniones mes", value: "68", delta: "▲ 14% vs. junio" },
        { label: "Reply rate", value: "23%", delta: "▲ 2,1 pts" },
        { label: "Leads activos", value: "2.020", delta: "▲ 318 nuevos" },
        { label: "Clientes", value: String(s.clients.length), delta: "▲ 2 este mes" }
      ],

      activity: s.clients.slice(0, 5).map(function (c) {

  function horarioView() {
    var first = state.horFrom, last = state.horTo, rowH = HOR_ROWH, totalH = (last - first) * rowH;
    var ws = state.weekStart, todayD = dayStartP(Date.now());
    var dayNames = ["Lun", "Mar", "Mié", "Jue", "Vie", "Sáb", "Dom"];
    function p2(n) { return String(n).padStart(2, "0"); }

    var a = new Date(ws), b = new Date(ws + 6 * DAY);
    var range = a.getDate() + "–" + b.getDate() + " " + MES_ES[b.getMonth()] + " " + b.getFullYear();

    // cabecera de días
    var header = '<div style="width:54px;"></div>';
    for (var i = 0; i < 7; i++) {
      var dt = ws + i * DAY, isT = dayStartP(dt) === todayD;
      header += '<div style="padding:9px 6px;text-align:center;">'
        + '<div style="font-size:11px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:' + (isT ? "#5b3ad9" : "#a8a3b8") + ';">' + dayNames[i] + '</div>'
        + '<div class="display-num" style="font-size:20px;margin-top:1px;color:' + (isT ? "#5b3ad9" : "#141319") + ';">' + new Date(dt).getDate() + '</div></div>';
    }

    // regla de horas
    var gutter = '<div style="position:relative;height:' + totalH + 'px;">';
    for (var h = first; h <= last; h++) {
      gutter += '<div style="position:absolute;top:' + ((h - first) * rowH) + 'px;right:7px;transform:translateY(-6px);font-size:10.5px;color:#a8a3b8;">' + p2(h) + ':00</div>';
    }
    gutter += '</div>';

    // bloques por día
    var perDay = [[], [], [], [], [], [], []];
    state.tasks.forEach(function (t, idx) {
      if (t.start == null) return;
      var di = Math.floor((dayStartP(t.start) - ws) / DAY);
      if (di < 0 || di > 6) return;
      perDay[di].push({ t: t, idx: idx });
    });

    var perDayBreaks = [[], [], [], [], [], [], []];
    state.breaks.forEach(function (b) {
      var bi = Math.floor((dayStartP(b.start) - ws) / DAY);
      if (bi < 0 || bi > 6) return;
      perDayBreaks[bi].push(b);
    });

    var cols = "";
    for (var d = 0; d < 7; d++) {
      var dt2 = ws + d * DAY, isT2 = dayStartP(dt2) === todayD;
      var av = state.avail ? state.avail[d] : null;
      var availBg = "";
      if (av && av.enabled && av.ranges.length) {
        var cc2 = COLORS[av.color || "violet"];
        availBg = av.ranges.map(function (r) {
          var rt = (Math.max(first, r.from) - first) * rowH, rh = (Math.min(last, r.to) - Math.max(first, r.from)) * rowH;
          return rh > 0 ? '<div style="position:absolute;left:0;right:0;top:' + rt + 'px;height:' + rh + 'px;background:' + cc2[1] + '80;"></div>' : "";
        }).join("");
      }
      var breaksHtml = perDayBreaks[d].map(function (b) {
        var bdur = b.durH || 1, bsd = new Date(b.start), bsh = bsd.getHours(), btop = (bsh - first) * rowH, bH = Math.max(22, bdur * rowH - 4);
        return '<div class="hor-brk hor-bdrag" draggable="true" data-bi="' + b.id + '" style="position:absolute;left:3px;right:3px;top:' + btop + 'px;height:' + bH + 'px;border-radius:8px;padding:3px 6px;overflow:hidden;background:repeating-linear-gradient(45deg,#eeecf3,#eeecf3 6px,#e5e2ee 6px,#e5e2ee 12px);border:1px solid #ddd8e8;">'
          + '<div style="display:flex;align-items:center;gap:3px;">'
          + '<span style="font-size:10px;font-weight:600;color:#8b8699;white-space:nowrap;">' + p2(bsh) + ':00</span>'
          + '<button data-act="hor-bdur" data-id="' + b.id + '" data-d="-1" title="Menos" style="border:none;background:transparent;color:#8b8699;cursor:pointer;font-size:12px;line-height:1;padding:0 2px;">－</button>'
          + '<span style="font-size:9.5px;color:#8b8699;white-space:nowrap;">' + bdur + 'h</span>'
          + '<button data-act="hor-bdur" data-id="' + b.id + '" data-d="1" title="Más" style="border:none;background:transparent;color:#8b8699;cursor:pointer;font-size:12px;line-height:1;padding:0 2px;">＋</button>'
          + '<button data-act="hor-brk-del" data-id="' + b.id + '" title="Eliminar descanso" style="margin-left:auto;border:none;background:transparent;color:#8b8699;cursor:pointer;font-size:11px;line-height:1;padding:0;">✕</button></div>'
          + '<div style="font-size:11.5px;font-weight:500;color:#6f6a83;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">☕ ' + esc(b.label) + '</div>'
          + '</div>';
      }).join("");
      var nowLine = "";
      if (isT2) {
        var nowT = new Date(), nh = nowT.getHours() + nowT.getMinutes() / 60;
        if (nh >= first && nh <= last) nowLine = '<div style="position:absolute;left:0;right:0;top:' + ((nh - first) * rowH) + 'px;height:0;border-top:2px solid #ea4335;z-index:6;pointer-events:none;"><span style="position:absolute;left:-3px;top:-4px;width:7px;height:7px;border-radius:50%;background:#ea4335;"></span></div>';
      }
      var blocks = perDay[d].map(function (o) {
        var t = o.t, dur = t.durH || 1, sd = new Date(t.start), sh = sd.getHours() + sd.getMinutes() / 60;
        var pc = COLORS[taskColorKey(t, o.idx)];
        var top = (sh - first) * rowH, hgt = Math.max(26, dur * rowH - 4), sHour = Math.floor(sh);
        return '<div class="hor-block hor-drag" draggable="true" data-i="' + o.idx + '" style="position:absolute;left:3px;right:3px;top:' + top + 'px;height:' + hgt + 'px;background:' + pc[0] + ';border:1px solid ' + pc[1] + '2e;border-left:3px solid ' + pc[1] + ';border-radius:8px;padding:3px 6px;overflow:hidden;box-shadow:0 2px 6px rgba(20,19,25,0.06);">'

          + '<button data-act="hor-color" data-i="' + o.idx + '" title="Cambiar color" style="width:11px;height:11px;border-radius:50%;background:' + pc[1] + ';border:none;cursor:pointer;flex:none;padding:0;"></button>'
          + '<span style="font-size:10px;font-weight:600;color:' + pc[1] + ';white-space:nowrap;">' + p2(sHour) + ':00</span>'
          + '<button data-act="hor-dur" data-i="' + o.idx + '" data-d="-1" title="Menos duración" style="border:none;background:transparent;color:' + pc[1] + ';cursor:pointer;font-size:12px;line-height:1;padding:0 2px;">－</button>'

          + '<button data-act="hor-dur" data-i="' + o.idx + '" data-d="1" title="Más duración" style="border:none;background:transparent;color:' + pc[1] + ';cursor:pointer;font-size:12px;line-height:1;padding:0 2px;">＋</button>'

          + (hgt > 52 ? '<div style="font-size:10.5px;font-weight:300;color:#8b8699;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + esc(t.client) + '</div>' : '')
          + '</div>';
      }).join("");
      cols += '<div class="hor-daycol" data-day="' + dt2 + '" style="position:relative;height:' + totalH + 'px;border-left:1px solid #f1eefa;background-color:#f6f4fa;background-image:repeating-linear-gradient(to bottom,#eeecf5 0,#eeecf5 1px,transparent 1px,transparent ' + rowH + 'px);">' + availBg + breaksHtml + nowLine + blocks + '</div>';
    }

    // panel «sin horario»
    var uns = state.tasks.map(function (t, idx) { return { t: t, idx: idx }; }).filter(function (o) { return o.t.start == null; });
    var unsList = uns.length ? uns.map(function (o) {
      var pc = COLORS[taskColorKey(o.t, o.idx)];
      return '<div class="hor-unsched hor-drag" draggable="true" data-i="' + o.idx + '" style="border:1px solid #f1eefa;border-radius:10px;padding:9px 11px;margin-bottom:8px;background:#fcfbff;display:flex;gap:9px;align-items:flex-start;">'
        + '<span style="width:8px;height:8px;border-radius:2px;background:' + pc[1] + ';margin-top:5px;flex:none;"></span>'
        + '<span style="min-width:0;line-height:1.3;"><span style="display:block;font-size:12.5px;font-weight:500;color:#141319;">' + esc(o.t.title) + '</span>'
        + '<span style="display:block;font-size:11px;font-weight:300;color:#8b8699;">' + esc(o.t.client) + '</span></span></div>';
    }).join("") : '<div style="font-size:12px;font-weight:300;color:#a8a3b8;padding:6px 2px;">Todo tiene horario 🎉</div>';

    var panel = '<div class="hor-unschedzone" style="background:#fff;border:1px solid #edeaf7;border-radius:18px;padding:15px;box-shadow:0 8px 22px rgba(122,90,248,0.05);">'

    var name,company,msgs;
    if(d){ name=d.name; company=d.company; msgs=d.msgs.map(function(x){return Object.assign({},x);}); }
    else { name=prettyName(email); company=(email.split("@")[1]||"").split(".")[0].replace(/\b\w/,function(c){return c.toUpperCase();}); msgs=[ m("outbound","Hola "+firstName(name)+", te escribo para retomar nuestra conversación. ¿Lo comentamos?",-3*DAY) ]; }

  function rescheduleFollow(fid,newDayMs){
    var moved=null;
    allFollowups().forEach(function(o){ if(o.f.id===fid){ var d=new Date(o.f.scheduled_at); var nd=new Date(newDayMs); nd.setHours(d.getHours(),d.getMinutes(),0,0); o.f.scheduled_at=nd.getTime(); moved={f:o.f,t:o.t}; }});

  function generateReply(t,tone){
    var fn=firstName(t.contact_name)||"hola", lm=lastMsg(t);
    var inbound=lm&&lm.direction==="inbound"?(lm.body_text||"").toLowerCase():"";
    var contract=/contrato|propuesta|presupuesto|factura|condiciones|compras/.test(inbound);
    var asks=inbound.indexOf("?")!==-1||/caso|reply rate|precio|cómo/.test(inbound);
    var mid=contract?"Te preparo hoy mismo la propuesta con las condiciones y te la paso para compras.":asks?"Te respondo a lo concreto: te paso los casos y los números reales, sin humo.":"Creo que encaja con lo que buscáis y me encantaría enseñártelo en concreto.";
    var open,cta;
    if(tone==="directo"){ open="Hola "+fn+","; cta="¿Llamada de 15 min esta semana? Dime hueco y lo bloqueo."; }
    else if(tone==="cercano"){ open="¡Hola "+fn+"!"; cta="Si te apetece lo vemos en una llamada corta y relajada, cuando mejor te venga."; }
    else { open="Hola "+fn+","; cta="¿Te viene bien una llamada de 15 min esta semana para verlo en detalle?"; }
    return "<p>"+esc(open)+"</p><p>"+esc(mid)+"</p><p>"+esc(cta)+"</p><p>Un saludo,<br>Xavi</p>";

    document.addEventListener("dragend", function(e){ var ev=e.target.closest(".seg-ev"); if(ev) ev.classList.remove("dragging"); document.querySelectorAll(".drop-hot").forEach(function(x){x.classList.remove("drop-hot");}); drag.fu=null; });
    document.addEventListener("dragover", function(e){ if(!active||!drag.fu) return; var cell=e.target.closest(".seg-day"); if(cell){ e.preventDefault(); e.dataTransfer.dropEffect="move"; cell.classList.add("drop-hot"); } });

  function onInput(e){ if(!active) return; var el=e.target.closest("[data-sm]"); if(!el) return; var mo=el.getAttribute("data-sm"); state[mo]=el.value; if(mo==="importQuery"){ var s=document.getElementById("opseg-import-sugg"); if(s) s.innerHTML=importSuggestions(); } }
  function onClick(e){
    if(!active) return;
    var b=e.target.closest("[data-sa]"); if(!b) return;
    var a=b.getAttribute("data-sa");
    switch(a){
      case "prov": doConnect(b.getAttribute("data-p")); break;
      case "connect": doConnect("IMAP"); break;
      case "import-open": state.importOpen=true; state.importQuery=""; render(); setTimeout(function(){ var i=document.getElementById("opseg-import-input"); if(i) i.focus(); },30); break;
      case "import-close": if(e.target===b){ state.importOpen=false; render(); } break;
      case "import-do": importConversation(b.getAttribute("data-email")||state.importQuery); break;
      case "open": state.openThread=b.getAttribute("data-id"); state.draftReply=""; state.draftFollow=""; state.schedInput=defaultSched(); render(); break;
      case "drawer-close": state.openThread=null; render(); break;

      case "tone": state.replyTone=b.getAttribute("data-t"); renderDrawer(); break;

      case "sched-follow": scheduleFollow(); break;

      case "open-fu": { var fid=b.getAttribute("data-id"); var o=allFollowups().filter(function(x){return x.f.id===fid;})[0]; if(o){ state.openThread=o.t.id; state.draftReply=""; state.draftFollow=""; state.schedInput=defaultSched(); render(); } break; }

  }

    }).join("")+'</div>':'<div style="font-size:12px;font-weight:300;color:#a8a3b8;">Sin follow-ups. Programa uno abajo y aparecerá en el calendario.</div>';
    var toneChips=[["normal","Normal"],["directo","Directo"],["cercano","Cercano"]].map(function(x){ var on=state.replyTone===x[0];
      return '<button class="seg-ghost" data-sa="tone" data-t="'+x[0]+'" style="border:1px solid '+(on?"#7a5af8":"#e7e2f5")+';background:'+(on?"#f4f2ff":"#fff")+';color:'+(on?"#5b3ad9":"#57565f")+';border-radius:99px;padding:5px 11px;font-size:11.5px;cursor:pointer;">'+x[1]+'</button>'; }).join("");
    host.innerHTML=
      '<div data-sa="drawer-close" style="position:fixed;inset:0;z-index:90;background:rgba(20,19,25,0.28);"></div>'
      + '<div class="seg-drawer seg-scroll" style="position:fixed;top:0;right:0;height:100vh;width:460px;z-index:100;background:#faf9fe;box-shadow:-20px 0 50px rgba(20,19,25,0.14);display:flex;flex-direction:column;overflow:auto;">'
      + '<div style="flex:none;background:#fff;border-bottom:1px solid #edeaf7;padding:15px 18px;display:flex;align-items:center;gap:12px;">'
      + '<span style="width:40px;height:40px;flex:none;border-radius:11px;background:#ece7ff;color:#5b3ad9;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;">'+esc(initials(t.contact_name))+'</span>'
      + '<div style="min-width:0;flex:1;"><div style="font-size:15px;font-weight:500;">'+esc(t.contact_name)+'</div><div style="font-size:12px;font-weight:300;color:#8b8699;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+esc(t.company)+' · '+esc(t.email)+'</div></div>'
      + '<button class="seg-ghost" data-sa="drawer-close" style="border:1px solid #e7e2f5;background:#fff;color:#57565f;border-radius:9px;width:32px;height:32px;cursor:pointer;font-size:14px;">✕</button></div>'
      + '<div class="seg-scroll" style="flex:1;min-height:0;padding:18px;overflow:auto;">'
      + '<div style="font-size:11.5px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#a8a3b8;margin-bottom:12px;">Conversación importada</div>'
      + '<div style="display:flex;flex-direction:column;">'+transcript+'</div>'
      + '<div style="margin-top:22px;background:#fff;border:1px solid #edeaf7;border-radius:14px;padding:14px;">'
      + '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;"><span style="font-size:13.5px;font-weight:500;">Escribir</span><div style="margin-left:auto;display:flex;gap:6px;">'+toneChips+'</div></div>'
      + '<textarea data-sm="draftReply" class="seg-in" placeholder="Escribe tu mensaje o genéralo con IA…" style="width:100%;min-height:84px;border:1px solid #e7e2f5;border-radius:10px;padding:11px;font-size:13px;font-weight:300;outline:none;line-height:1.55;">'+esc(state.draftReply)+'</textarea>'
      + '<div style="display:flex;gap:8px;margin-top:10px;"><button class="seg-ghost" data-sa="gen-reply" style="border:1px solid #e0d9f7;background:#f4f2ff;color:#5b3ad9;border-radius:9px;padding:8px 13px;font-size:12.5px;cursor:pointer;">✦ IA</button>'
      + '<button class="seg-primary" data-sa="send-reply" style="border:none;background:#7a5af8;color:#fff;border-radius:9px;padding:8px 16px;font-size:12.5px;cursor:pointer;">Enviar</button></div></div>'
      + '<div style="margin-top:14px;background:#fff;border:1px solid #edeaf7;border-radius:14px;padding:14px;">'
      + '<div style="font-size:13.5px;font-weight:500;margin-bottom:10px;">Programar follow-up</div>'
      + '<textarea data-sm="draftFollow" class="seg-in" placeholder="Cuerpo del follow-up…" style="width:100%;min-height:64px;border:1px solid #e7e2f5;border-radius:10px;padding:11px;font-size:13px;font-weight:300;outline:none;line-height:1.55;">'+esc(state.draftFollow)+'</textarea>'
      + '<div style="display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap;">'
      + '<input type="datetime-local" data-sm="schedInput" class="seg-in" value="'+esc(state.schedInput)+'" style="border:1px solid #e7e2f5;border-radius:9px;padding:8px 10px;font-size:12.5px;outline:none;flex:1;min-width:170px;">'
      + '<button class="seg-ghost" data-sa="gen-follow" style="border:1px solid #e0d9f7;background:#f4f2ff;color:#5b3ad9;border-radius:9px;padding:8px 12px;font-size:12.5px;cursor:pointer;">✦ IA</button>'
      + '<button class="seg-primary" data-sa="sched-follow" style="border:none;background:#7a5af8;color:#fff;border-radius:9px;padding:8px 15px;font-size:12.5px;cursor:pointer;">Programar</button></div>'
      + '<div style="margin-top:14px;border-top:1px solid #f4f2fb;padding-top:12px;"><div style="font-size:11.5px;font-weight:600;color:#8b8699;margin-bottom:8px;">Programados</div>'+fuList+'</div></div>'
      + '</div></div>';
  }
  function importSuggestions(){
    var q=state.importQuery.trim().toLowerCase();
    var imported=state.threads.map(function(t){return t.email.toLowerCase();});
    var list=DIRECTORY.filter(function(d){ if(imported.indexOf(d.email.toLowerCase())!==-1) return false; if(!q) return true; return (d.email+" "+d.name+" "+d.company).toLowerCase().indexOf(q)!==-1; });
    var rows=list.map(function(d){
      return '<button class="seg-conv" data-sa="import-do" data-email="'+esc(d.email)+'" style="text-align:left;width:100%;border:none;border-bottom:1px solid #f4f2fb;background:#fff;padding:11px 14px;cursor:pointer;display:flex;gap:11px;align-items:center;">'
        + '<span style="width:34px;height:34px;flex:none;border-radius:9px;background:#ece7ff;color:#5b3ad9;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;">'+esc(initials(d.name))+'</span>'
        + '<span style="min-width:0;flex:1;line-height:1.3;"><span style="display:block;font-size:13.5px;font-weight:500;">'+esc(d.name)+' · '+esc(d.company)+'</span><span style="display:block;font-size:12px;font-weight:300;color:#8b8699;">'+esc(d.email)+'</span></span>'
        + '<span style="font-size:11.5px;color:#5b3ad9;">Importar →</span></button>';
    }).join("");
    var custom=q&&q.indexOf("@")!==-1&&list.every(function(d){return d.email.toLowerCase()!==q;})
      ? '<button class="seg-conv" data-sa="import-do" data-email="'+esc(q)+'" style="text-align:left;width:100%;border:none;background:#fbfaff;padding:11px 14px;cursor:pointer;display:flex;gap:11px;align-items:center;"><span style="width:34px;height:34px;flex:none;border-radius:9px;background:#f4f2ff;color:#5b3ad9;display:flex;align-items:center;justify-content:center;font-size:15px;">＋</span><span style="min-width:0;flex:1;font-size:13px;font-weight:400;color:#5b3ad9;">Importar «'+esc(q)+'»</span></button>' : "";
    return (rows+custom)||'<div style="padding:20px 14px;font-size:12.5px;font-weight:300;color:#a8a3b8;text-align:center;">Escribe el email de la persona para importar la conversación.</div>';
  }
  function renderModal(){
    var host=document.getElementById("opseg-modal"); if(!host) return;
    if(!active||!state.importOpen){ host.innerHTML=""; return; }
    host.innerHTML=
      '<div data-sa="import-close" style="position:fixed;inset:0;z-index:110;background:rgba(20,19,25,0.32);display:flex;align-items:flex-start;justify-content:center;padding-top:12vh;">'
      + '<div style="width:100%;max-width:480px;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 30px 70px rgba(20,19,25,0.28);">'
      + '<div style="padding:16px 18px;border-bottom:1px solid #f1eefa;"><div style="font-size:15px;font-weight:500;margin-bottom:3px;">Importar conversación</div>'
      + '<div style="font-size:12.5px;font-weight:300;color:#8b8699;">Escribe el email de la persona; traeré todo el historial que tengáis.</div>'
      + '<div style="position:relative;display:flex;align-items:center;margin-top:12px;"><span style="position:absolute;left:13px;font-size:14px;color:#a8a3b8;">⌕</span>'
      + '<input id="opseg-import-input" class="seg-in" data-sm="importQuery" value="'+esc(state.importQuery)+'" placeholder="nombre@empresa.com" style="width:100%;padding:11px 14px 11px 34px;border:1px solid #e7e2f5;border-radius:11px;font-size:14px;font-weight:300;outline:none;"></div></div>'
      + '<div id="opseg-import-sugg" class="seg-scroll" style="max-height:340px;overflow:auto;">'+importSuggestions()+'</div>'
      + '</div></div>';
    var i=document.getElementById("opseg-import-input"); if(i){ var v=i.value; i.focus(); i.value=""; i.value=v; }
  }
  function renderToast(){
    var h=document.getElementById("opseg-toast"); if(!h) return;
    h.innerHTML=(active&&state.toast)?'<div style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:130;background:#141319;color:#fff;padding:13px 22px;border-radius:13px;font-size:14px;font-weight:300;box-shadow:0 18px 44px rgba(20,19,25,0.3);max-width:90vw;">'+esc(state.toast)+'</div>':"";
  }

  function render(){ attach(); ensureContainers(); renderInline(); renderDrawer(); renderModal(); renderToast(); }

  return {
    mount:function(el){ mountEl=el; active=true; render(); },
    hide:function(){ active=false; var d=document.getElementById("opseg-drawer"); if(d) d.innerHTML=""; var mm=document.getElementById("opseg-modal"); if(mm) mm.innerHTML=""; var tt=document.getElementById("opseg-toast"); if(tt) tt.innerHTML=""; }
  };
})();
</script>
</body>
</html>
