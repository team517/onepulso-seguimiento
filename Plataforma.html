<!DOCTYPE html>
<html lang="es">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=Arapey&display=swap" rel="stylesheet">

<style>
  html, body { margin:0; height:100%; }
  body { background:#f7f6fc; color:#141319; font-family:"Inter", system-ui, -apple-system, sans-serif; -webkit-font-smoothing:antialiased; }
  * { box-sizing:border-box; }
  a { color:#7a5af8; text-decoration:none; }
  a:hover { color:#6a48e8; }
  ::selection { background:#ece7ff; }
  .display-num { font-family:"Arapey", Georgia, serif; font-weight:400; }
  button { font-family:inherit; }
  input, select { font-family:inherit; }
  .op-scroll::-webkit-scrollbar { width:9px; }
  .op-scroll::-webkit-scrollbar-thumb { background:#e3ddf2; border-radius:99px; }

  /* hover / focus states ported from the design's style-hover / style-focus */
  .op-search:focus { border-color:#7a5af8 !important; box-shadow:0 0 0 3px rgba(122,90,248,0.13); }
  .op-new:hover { background:#6a48e8 !important; }
  .op-followadv:hover { background:#f4f2ff !important; border-color:#d9d3f3 !important; }
  .op-taskadv:hover { background:#f4f2ff !important; }
  .op-nav:hover { background:#f2effc; }

  /* --- Seguimiento module --- */
  .seg-ev { cursor:grab; }
  .seg-ev:active { cursor:grabbing; }
  .seg-ev.dragging { opacity:.35; }
  .seg-day.drop-hot { background:#f0ebff !important; outline:2px dashed #b9a7fb; outline-offset:-2px; }
  .seg-conv:hover { background:#faf9ff !important; }
  .seg-day:hover { background:#faf9ff; }
  .seg-in:focus { border-color:#7a5af8 !important; box-shadow:0 0 0 3px rgba(122,90,248,0.13); }
  .seg-primary:hover { background:#6a48e8 !important; }
  .seg-ghost:hover { background:#f4f2ff !important; border-color:#d9d3f3 !important; }
  .seg-drawer { transition:transform .28s cubic-bezier(.4,0,.2,1); }
  .seg-scroll::-webkit-scrollbar { width:9px; height:9px; }
  .seg-scroll::-webkit-scrollbar-thumb { background:#e3ddf2; border-radius:99px; }

  /* --- Horario module --- */
  .hor-drag { cursor:grab; }
  .hor-drag:active { cursor:grabbing; }
  .hor-daycol.hor-hot { background-color:#f4f2ff !important; }
  .hor-unschedzone.hor-hot { outline:2px dashed #b9a7fb; outline-offset:-4px; }
  .hor-block:hover { box-shadow:0 5px 14px rgba(122,90,248,0.18) !important; }
  .hor-unsched:hover { border-color:#d9d3f3 !important; background:#f7f5ff !important; }

  /* --- Landing / login --- */
  .auth-shell { display:grid; grid-template-columns:1.1fr 0.9fr; min-height:100vh; }
  @media (max-width:820px){ .auth-shell { grid-template-columns:1fr !important; } .auth-hero { display:none !important; } }

  @media (max-width: 900px){ .op-shell { grid-template-columns:1fr !important; } .op-side { display:none !important; } .op-grid4 { grid-template-columns:repeat(2,1fr) !important; } .op-two { grid-template-columns:1fr !important; } .op-kanban { grid-template-columns:1fr !important; } .seg-grid { grid-template-columns:1fr !important; } .seg-drawer { width:100vw !important; } }
  @media (max-width: 560px){ .op-grid4 { grid-template-columns:1fr !important; } }
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";
(function () {
  // ---- helpers ----------------------------------------------------------
  var esc = function (s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };

  var PILL = function (bg, fg) {
    return "display:inline-flex; align-items:center; padding:5px 11px; border-radius:99px; font-size:12.5px; font-weight:400; background:" + bg + "; color:" + fg + ";";
  };
  var STATUS_PILL = { "Activo": PILL("#e4f7ed", "#12784a"), "Onboarding": PILL("#ece7ff", "#5b3ad9"), "Pausa": PILL("#fdf0e3", "#a2670f"), "Renovación": PILL("#e6f1ff", "#1f5bb5") };
  var FOLLOW_PILL = { "Pendiente": PILL("#fdf0e3", "#a2670f"), "Enviado": PILL("#ece7ff", "#5b3ad9"), "Respondido": PILL("#e4f7ed", "#12784a"), "Cerrado": PILL("#f1f0f5", "#6f6a83") };
  var PRIO_PILL = { "Alta": PILL("#fdeaef", "#b0234c"), "Media": PILL("#ece7ff", "#5b3ad9"), "Baja": PILL("#f1f0f5", "#6f6a83") };
  var FOLLOW_ORDER = ["Pendiente", "Enviado", "Respondido", "Cerrado"];
  var TASK_ORDER = ["Por hacer", "En curso", "Hecho"];

  // ---- Horario (schedule) helpers ---------------------------------------
  var DAY = 86400000, HOUR = 3600000;
  var MES_ES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  var HOR_FIRST = 8, HOR_LAST = 20, HOR_ROWH = 46;
  var PRIO_BLOCK = { "Alta": ["#fdeaef","#b0234c"], "Media": ["#ece7ff","#5b3ad9"], "Baja": ["#e9f7ef","#1a9d54"] };
  // Paleta de colores para los bloques del horario ([fondo, color])
  var COLORS = { violet: ["#ece7ff","#7a5af8"], blue: ["#e4edff","#2f6bd6"], green: ["#e2f6ea","#12a150"], amber: ["#fdf1dc","#c47d10"], red: ["#fdeaef","#d63864"], teal: ["#ddf5f2","#0f9b8e"], pink: ["#fceaf5","#c23e8f"] };
  var COLOR_ORDER = ["violet","blue","green","amber","red","teal","pink"];
  function taskColorKey(t, idx){ return (t && t.color) || COLOR_ORDER[idx % COLOR_ORDER.length]; }
  var _brk = 0; function brkId(){ return "brk" + (++_brk); }
  function dayStartP(ms){ var d = new Date(ms); d.setHours(0,0,0,0); return d.getTime(); }
  function mondayOf(ms){ var d = new Date(ms); var wd = (d.getDay()+6)%7; d.setHours(0,0,0,0); return d.getTime() - wd*DAY; }

  // ---- state ------------------------------------------------------------
  var state = {
    view: "dash",
    query: "",
    followFilter: "Todos",
    toast: "",
    weekStart: mondayOf(Date.now()),
    quickAdd: null,
    horFrom: 8,
    horTo: 20,
    franjaOpen: false,
    franjaDraft: null,
    breaks: [],
    avail: null,
    availOpen: false,
    availDraft: null,
    logo: null,
    persoOpen: false,
    clients: [
      { name: "Vitalis Health", sector: "Salud digital", owner: "Xavier F.", meetings: 24, leads: 412, status: "Activo" },
      { name: "Bloom Studio", sector: "Audiovisual", owner: "Marta R.", meetings: 17, leads: 268, status: "Activo" },
      { name: "Cedra Talent", sector: "RRHH", owner: "Xavier F.", meetings: 9, leads: 154, status: "Onboarding" },
      { name: "Nordic Fintech", sector: "Fintech", owner: "Luis P.", meetings: 31, leads: 520, status: "Renovación" },
      { name: "Alma Legal", sector: "Legal B2B", owner: "Marta R.", meetings: 6, leads: 98, status: "Pausa" },
      { name: "Ridge Logistics", sector: "Logística", owner: "Luis P.", meetings: 21, leads: 347, status: "Activo" },
      { name: "Kora Analytics", sector: "SaaS datos", owner: "Xavier F.", meetings: 13, leads: 221, status: "Onboarding" }
    ],
    follows: [
      { contact: "María Serrano", company: "Vitalis Health", subject: "Propuesta Q3", step: "Follow-up 2/4", due: "Hoy · 11:00", state: "Pendiente", icon: "✉" },
      { contact: "Jordi Puig", company: "Nordic Fintech", subject: "Renovación anual", step: "Follow-up 1/3", due: "Hoy · 16:30", state: "Enviado", icon: "✦" },
      { contact: "Elena Ruiz", company: "Bloom Studio", subject: "Casos de éxito", step: "Follow-up 3/4", due: "Mañana", state: "Respondido", icon: "◎" },
      { contact: "Tomás Vidal", company: "Cedra Talent", subject: "Kickoff campaña", step: "Follow-up 1/4", due: "28 jul", state: "Pendiente", icon: "✉" },
      { contact: "Nuria Camps", company: "Ridge Logistics", subject: "Ampliar buzones", step: "Follow-up 2/3", due: "29 jul", state: "Enviado", icon: "✦" },
      { contact: "Iván Costa", company: "Kora Analytics", subject: "Revisión copy", step: "Follow-up 4/4", due: "30 jul", state: "Cerrado", icon: "◎" }
    ],
    tasks: [
      { title: "Validar 800 leads del ICP de Vitalis", client: "Vitalis Health", who: "MR", due: "Hoy", priority: "Alta", state: "Por hacer" },
      { title: "Escribir secuencia A/B para Cedra", client: "Cedra Talent", who: "XF", due: "Hoy", priority: "Alta", state: "Por hacer" },
      { title: "Calentar 6 buzones nuevos", client: "Ridge Logistics", who: "LP", due: "28 jul", priority: "Media", state: "Por hacer" },
      { title: "Revisar reputación de dominios", client: "Nordic Fintech", who: "LP", due: "Hoy", priority: "Alta", state: "En curso" },
      { title: "Preparar informe mensual", client: "Bloom Studio", who: "MR", due: "29 jul", priority: "Media", state: "En curso" },
      { title: "Actualizar ICP tras feedback", client: "Kora Analytics", who: "XF", due: "31 jul", priority: "Baja", state: "En curso" },
      { title: "Agendar discovery con Alma Legal", client: "Alma Legal", who: "XF", due: "24 jul", priority: "Media", state: "Hecho" },
      { title: "Migrar respuestas al CRM", client: "Vitalis Health", who: "LP", due: "23 jul", priority: "Baja", state: "Hecho" }
    ]
  };

  // El horario empieza vacío: tú pones las horas (arrastrando o escribiendo en el calendario).
  state.avail = defaultAvail();
  computeHours();

  var toastTimer = null;
  function flash(msg) {
    clearTimeout(toastTimer);
    state.toast = msg;
    renderToast();
    toastTimer = setTimeout(function () { state.toast = ""; renderToast(); }, 1900);
  }

  function navStyle(active) {
    return "display:flex; align-items:center; gap:11px; width:100%; text-align:left; padding:11px 13px; border-radius:12px; border:none; cursor:pointer; font-size:14.5px; letter-spacing:-0.01em; transition:background .18s;"
      + (active ? "background:#f2effc; color:#5b3ad9; font-weight:500;" : "background:transparent; color:#57565f; font-weight:300;");
  }

  function matches(text) {
    var q = state.query.trim().toLowerCase();
    return !q || text.toLowerCase().indexOf(q) !== -1;
  }

  // ---- actions ----------------------------------------------------------
  function advanceFollow(i) {
    var cur = FOLLOW_ORDER.indexOf(state.follows[i].state);
    var next = FOLLOW_ORDER[Math.min(cur + 1, FOLLOW_ORDER.length - 1)];
    state.follows[i] = Object.assign({}, state.follows[i], { state: next });
    render();
    flash(state.follows[i].contact + " → " + next);
  }

  function advanceTask(idx) {
    var t = state.tasks[idx];
    var next = TASK_ORDER[Math.min(TASK_ORDER.indexOf(t.state) + 1, 2)];
    state.tasks[idx] = Object.assign({}, t, { state: next });
    render();
    flash("Tarea movida");
  }

  function newTask(extra) {
    var t = Object.assign({ title: "Nueva tarea", client: "—", who: "XF", due: "", priority: "Media", state: "Por hacer" }, extra || {});
    state.tasks.push(t);
    return state.tasks.length - 1;
  }
  function drawScheduleCanvas(done) {
    computeHours();
    var SC = 2;                                   // supersampling → PDF nítido
    var first = state.horFrom, last = state.horTo;
    var margin = 34, gut = 62, rowH = 50, headH = 48, headerH = 84;
    var pageW = 1120, colW = (pageW - margin * 2 - gut) / 7;
    var totalH = (last - first) * rowH, pageH = margin + headerH + headH + totalH + margin;
    var W = Math.round(pageW * SC), H = Math.round(pageH * SC);
    var c = document.createElement("canvas"); c.width = W; c.height = H;
    var x = c.getContext("2d"); x.scale(SC, SC); x.textBaseline = "alphabetic";
    function rr(X, Y, w, h, r) { r = Math.min(r, w / 2, h / 2); x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + w, Y, X + w, Y + h, r); x.arcTo(X + w, Y + h, X, Y + h, r); x.arcTo(X, Y + h, X, Y, r); x.arcTo(X, Y, X + w, Y, r); x.closePath(); }
    var ws = state.weekStart, aa = new Date(ws), bb = new Date(ws + 6 * DAY);
    var range = aa.getDate() + "–" + bb.getDate() + " " + MES_ES[bb.getMonth()] + " " + bb.getFullYear();

    function paint() {
      x.fillStyle = "#ffffff"; x.fillRect(0, 0, pageW, pageH);
      // título (derecha)
      x.textAlign = "right"; x.fillStyle = "#141319"; x.font = "600 27px Inter, Arial, sans-serif";
      x.fillText("Horario semanal", pageW - margin, margin + 30);
      x.fillStyle = "#8b8699"; x.font = "400 15px Inter, Arial, sans-serif";
      x.fillText("Semana del " + range, pageW - margin, margin + 54);
      x.textAlign = "left";
      x.strokeStyle = "#edeaf7"; x.lineWidth = 1; x.beginPath(); x.moveTo(margin, margin + headerH - 6); x.lineTo(pageW - margin, margin + headerH - 6); x.stroke();

      var gridLeft = margin, gridTop = margin + headerH + headH, todayD = dayStartP(Date.now());
      var dn = ["LUN", "MAR", "MIÉ", "JUE", "VIE", "SÁB", "DOM"];
      for (var i = 0; i < 7; i++) {
        var cx = gridLeft + gut + i * colW, isT = dayStartP(ws + i * DAY) === todayD, mid = cx + colW / 2;
        x.textAlign = "center"; x.fillStyle = isT ? "#7a5af8" : "#a8a3b8"; x.font = "600 11px Inter, Arial, sans-serif";
        x.fillText(dn[i], mid, margin + headerH + 20);
        if (isT) { x.fillStyle = "#7a5af8"; rr(mid - 16, margin + headerH + 26, 32, 24, 12); x.fill(); x.fillStyle = "#fff"; } else x.fillStyle = "#141319";
        x.font = (isT ? "600 " : "400 ") + "17px Inter, Arial, sans-serif";
        x.fillText(String(new Date(ws + i * DAY).getDate()), mid, margin + headerH + 43);
      }
      x.textAlign = "left";
      for (var d = 0; d < 7; d++) {
        var colx = gridLeft + gut + d * colW, av = state.avail ? state.avail[d] : null;
        x.fillStyle = "#f7f5fb"; x.fillRect(colx, gridTop, colW, totalH);
        if (av && av.enabled) av.ranges.forEach(function (r) {
          var t0 = (Math.max(first, r.from) - first) * rowH, hh = (Math.min(last, r.to) - Math.max(first, r.from)) * rowH;
          if (hh > 0) { x.save(); x.globalAlpha = 0.5; x.fillStyle = COLORS[av.color || "violet"][1]; x.fillRect(colx, gridTop + t0, colW, hh); x.restore(); }
        });
      }
      x.font = "400 11px Inter, Arial, sans-serif";
      for (var h = first; h <= last; h++) {
        var yy = gridTop + (h - first) * rowH;
        x.strokeStyle = "#efedf6"; x.lineWidth = 1; x.beginPath(); x.moveTo(gridLeft + gut, yy + 0.5); x.lineTo(gridLeft + gut + 7 * colW, yy + 0.5); x.stroke();
        x.fillStyle = "#a8a3b8"; x.textAlign = "right"; x.fillText((h < 10 ? "0" : "") + h + ":00", gridLeft + gut - 9, yy + 4); x.textAlign = "left";
      }
      for (var s = 0; s <= 7; s++) { var sx = gridLeft + gut + s * colW; x.strokeStyle = "#e7e2f5"; x.beginPath(); x.moveTo(sx + 0.5, gridTop); x.lineTo(sx + 0.5, gridTop + totalH); x.stroke(); }
      state.breaks.forEach(function (bk) {
        var di = Math.floor((dayStartP(bk.start) - ws) / DAY); if (di < 0 || di > 6) return;
        var sh = new Date(bk.start).getHours(), dur = bk.durH || 1;
        var bx = gridLeft + gut + di * colW + 4, by = gridTop + (sh - first) * rowH + 3, bw = colW - 8, bh = dur * rowH - 6;
        x.fillStyle = "#e7e4ef"; rr(bx, by, bw, bh, 9); x.fill();
        x.fillStyle = "#6f6a83"; x.font = "600 12px Inter, Arial, sans-serif"; x.fillText("☕ " + bk.label, bx + 9, by + 19);
      });
      state.tasks.forEach(function (t, idx) {
        if (t.start == null) return;
        var di = Math.floor((dayStartP(t.start) - ws) / DAY); if (di < 0 || di > 6) return;
        var sh = new Date(t.start).getHours(), dur = t.durH || 1, pc = COLORS[taskColorKey(t, idx)];
        var bx = gridLeft + gut + di * colW + 4, by = gridTop + (sh - first) * rowH + 3, bw = colW - 8, bh = dur * rowH - 6;
        x.save(); x.shadowColor = "rgba(20,19,25,0.10)"; x.shadowBlur = 6; x.shadowOffsetY = 2; x.fillStyle = pc[0]; rr(bx, by, bw, bh, 10); x.fill(); x.restore();
        x.fillStyle = pc[1]; rr(bx, by, 4, bh, 2); x.fill();
        x.fillStyle = pc[1]; x.font = "600 11px Inter, Arial, sans-serif";
        x.fillText((sh < 10 ? "0" : "") + sh + ":00 – " + (sh + dur < 10 ? "0" : "") + (sh + dur) + ":00", bx + 12, by + 18);
        x.fillStyle = "#1f1d29"; x.font = "500 13px Inter, Arial, sans-serif";
        var ttl = t.title, maxc = Math.max(6, Math.floor((bw - 22) / 7.2));
        if (ttl.length > maxc) ttl = ttl.slice(0, maxc - 1) + "…";
        x.fillText(ttl, bx + 12, by + 35);
      });
      function finish() { done(c, range, pageW, pageH); }
      if (state.logo) {
        var img = new Image();
        img.onload = function () { var lh = 50, lw = img.width * (lh / img.height); if (lw > 300) { lw = 300; lh = img.height * (lw / img.width); } x.drawImage(img, margin, margin + 4, lw, lh); finish(); };
        img.onerror = function () { finish(); };
        img.src = state.logo;
      } else finish();
    }
    paint();
  }
  function downloadSchedule() {
    drawScheduleCanvas(function (canvas, range, pw, ph) {
      var imgData = canvas.toDataURL("image/png");
      var J = window.jspdf && window.jspdf.jsPDF;
      if (!J) {
        var l = document.createElement("a"); l.href = imgData; l.download = "horario-" + range.replace(/\s+/g, "-") + ".png";
        document.body.appendChild(l); l.click(); document.body.removeChild(l); flash("Horario descargado (PNG)"); return;
      }
      var pdf = new J({ orientation: pw >= ph ? "landscape" : "portrait", unit: "px", format: [pw, ph], compress: true });
      var W2 = pdf.internal.pageSize.getWidth(), H2 = pdf.internal.pageSize.getHeight();
      pdf.addImage(imgData, "PNG", 0, 0, W2, H2, undefined, "FAST");
      pdf.save("horario-" + range.replace(/\s+/g, "-") + ".pdf");
      flash("Horario descargado (PDF)");
    });
  }
  function onLogoFile(file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function (ev) {
      var img = new Image();
      img.onload = function () {
        var maxW = 600, sc = Math.min(1, maxW / img.width), cw = Math.round(img.width * sc), ch = Math.round(img.height * sc);
        var cv = document.createElement("canvas"); cv.width = cw; cv.height = ch;
        cv.getContext("2d").drawImage(img, 0, 0, cw, ch);
        state.logo = cv.toDataURL("image/png");
        render(); flash("Logo añadido");
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }
  function horHourFromY(col, clientY) {
    var r = col.getBoundingClientRect();
    var h = state.horFrom + Math.floor((clientY - r.top) / HOR_ROWH);
    return Math.max(state.horFrom, Math.min(state.horTo - 1, h));
  }
  function defaultAvail() {
    var a = [];
    for (var i = 0; i < 7; i++) {
      if (i <= 4) a.push({ enabled: true, color: COLOR_ORDER[i % COLOR_ORDER.length], ranges: [{ from: 10, to: 13 }, { from: 15, to: 19 }] });
      else a.push({ enabled: false, color: COLOR_ORDER[i % COLOR_ORDER.length], ranges: [] });
    }
    return a;
  }
  function computeHours() {
    // El calendario muestra el día completo (mínimo 8:00–20:00), ampliándose
    // si la disponibilidad, tareas o descansos caen fuera de esa base.
    var mn = 8, mx = 20;
    function inc(f, t) { if (f < mn) mn = f; if (t > mx) mx = t; }
    (state.avail || []).forEach(function (a) { if (a.enabled) a.ranges.forEach(function (r) { if (r.to > r.from) inc(r.from, r.to); }); });
    (state.tasks || []).forEach(function (t) { if (t.start != null) { var sh = new Date(t.start).getHours(); inc(sh, sh + (t.durH || 1)); } });
    (state.breaks || []).forEach(function (b) { var sh = new Date(b.start).getHours(); inc(sh, sh + (b.durH || 1)); });
    state.horFrom = Math.max(0, mn); state.horTo = Math.min(24, mx);
  }
  function quickAddCreate() {
    var qa = state.quickAdd; if (!qa) return;
    var el = document.getElementById("op-qa-input"); if (el) qa.text = el.value;
    var title = (qa.text || "").trim();
    if (qa.kind === "break" && qa.day != null) {
      state.breaks.push({ id: brkId(), start: qa.day + qa.hour * HOUR, durH: 1, label: title || "Descanso" });
      state.quickAdd = null; render();
      flash("Descanso añadido · " + (qa.hour < 10 ? "0" : "") + qa.hour + ":00"); return;
    }
    if (!title) { flash("Escribe un nombre para la tarea"); return; }
    var extra = { title: title, client: "—", who: "XF", priority: "Media", color: qa.color || "violet" };
    if (qa.day != null) { extra.start = qa.day + qa.hour * HOUR; extra.durH = 1; }
    newTask(extra);
    state.quickAdd = null; render();
    flash(qa.day != null ? ("Añadida «" + title + "» · " + (qa.hour < 10 ? "0" : "") + qa.hour + ":00") : ("Añadida «" + title + "» — arrástrala al horario"));
  }

  // ---- derived view model (mirrors renderVals) --------------------------
  function vals() {
    var s = state;
    var pendientes = s.follows.filter(function (f) { return f.state === "Pendiente"; }).length;
    var abiertas = s.tasks.filter(function (t) { return t.state !== "Hecho"; }).length;

    var views = [

    var gutter = '<div style="position:relative;height:' + totalH + 'px;">';
    for (var h = first; h <= last; h++) {
      gutter += '<div style="position:absolute;top:' + ((h - first) * rowH) + 'px;right:7px;transform:translateY(-6px);font-size:10.5px;color:#a8a3b8;">' + p2(h) + ':00</div>';
    }

    state.tasks.forEach(function (t, idx) {
      if (t.start == null) return;

      if (di < 0 || di > 6) return;
      perDay[di].push({ t: t, idx: idx });

    var perDayBreaks = [[], [], [], [], [], [], []];
    state.breaks.forEach(function (b) {

        + '<button data-sa="gen-follow" style="border:1px solid #e0d9f7;background:#f4f2ff;color:#5b3ad9;border-radius:10px;padding:10px 16px;font-size:13.5px;cursor:pointer;">✦ Crear con IA</button>'
        + '<button data-sa="sched-follow" style="border:none;background:#141319;color:#fff;border-radius:10px;padding:10px 20px;font-size:13.5px;font-weight:600;cursor:pointer;">🚀 Programar follow-up</button></div>'
        + '</div></div></div>'
      : '';
    host.innerHTML=
      '<div data-sa="drawer-close" style="position:fixed;inset:0;z-index:90;background:rgba(20,19,25,0.42);display:flex;align-items:center;justify-content:center;padding:20px;">'
      + '<div style="width:100%;max-width:900px;height:88vh;background:#faf9fe;border-radius:18px;box-shadow:0 40px 90px rgba(20,19,25,0.4);display:flex;flex-direction:column;overflow:hidden;">'
      + '<div style="flex:none;background:#fff;border-bottom:1px solid #edeaf7;padding:18px 24px;display:flex;align-items:center;gap:14px;">'
      + '<span style="width:44px;height:44px;flex:none;border-radius:12px;background:#ece7ff;color:#5b3ad9;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;">'+esc(initials(t.contact_name))+'</span>'
      + '<div style="min-width:0;flex:1;"><div style="font-size:17px;font-weight:500;">'+esc(t.contact_name)+'</div><div style="font-size:12.5px;font-weight:300;color:#8b8699;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+((t.participants&&t.participants.length)?("Con: "+t.participants.map(esc).join(", ")):esc(t.email))+'</div></div>'
      + '<button class="seg-ghost" data-sa="del-thread" data-id="'+t.id+'" title="Eliminar del seguimiento" style="border:1px solid #e7e2f5;background:#fff;color:#b0234c;border-radius:9px;padding:8px 12px;cursor:pointer;font-size:12.5px;">🗑 Eliminar</button>'
      + '<button class="seg-ghost" data-sa="drawer-close" style="border:1px solid #e7e2f5;background:#fff;color:#57565f;border-radius:9px;width:34px;height:34px;cursor:pointer;font-size:15px;">✕</button></div>'
      + '<div class="seg-scroll" style="flex:1;min-height:0;min-width:0;padding:22px 26px;overflow-y:auto;overflow-x:hidden;">'
      + '<div style="max-width:820px;width:100%;margin:0 auto;">'
      + '<div style="display:flex;flex-direction:column;width:100%;gap:12px;">'+transcript+'</div>'
      + '<div style="margin-top:22px;background:#fff;border:1px solid #edeaf7;border-radius:14px;padding:16px;">'
      + '<div style="font-size:14px;font-weight:600;margin-bottom:12px;">Responder</div>'
      + '<div style="font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#8b8699;margin-bottom:6px;">Pista para la IA (opcional)</div>'
      + '<input data-sm="aiHint" class="seg-in" value="'+esc(state.aiHint)+'" placeholder="Ej: sé más directo y propón el martes 10:00" style="width:100%;border:1px solid #e7e2f5;border-radius:10px;padding:11px 13px;font-size:13px;outline:none;margin-bottom:12px;background:#f8f8fc;">'
      + '<div style="display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;">'
      + '<button class="seg-ghost" data-sa="gen-reply" style="border:1px solid #e7e2f5;background:#fff;color:#141319;border-radius:10px;padding:9px 14px;font-size:13px;cursor:pointer;">✦ Sugerir respuesta IA</button>'
      + '<button class="seg-ghost" data-sa="fu-open" style="border:1px solid #e7e2f5;background:#fff;color:#141319;border-radius:10px;padding:9px 14px;font-size:13px;cursor:pointer;">📅 Programar follow-up</button></div>'
      + '<textarea data-sm="draftReply" class="seg-in" placeholder="Tu respuesta aquí…" style="width:100%;min-height:120px;border:1px solid #e7e2f5;border-radius:10px;padding:12px;font-size:13.5px;font-weight:300;outline:none;line-height:1.55;background:#f8f8fc;">'+esc(state.draftReply)+'</textarea>'
      + ((state.attachments&&state.attachments.length)?'<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;">'+state.attachments.map(function(f,i){return '<span style="display:inline-flex;align-items:center;gap:6px;background:#f4f2ff;border:1px solid #e3ddf7;border-radius:8px;padding:4px 9px;font-size:11.5px;color:#5b3ad9;">📎 '+esc(f.name)+' <button data-sa="attach-remove" data-i="'+i+'" style="border:none;background:transparent;color:#b0234c;cursor:pointer;font-size:12px;padding:0;">✕</button></span>';}).join("")+'</div>':'')
      + '<div style="display:flex;gap:8px;margin-top:8px;"><input data-sm="linkUrl" class="seg-in" value="'+esc(state.linkUrl)+'" placeholder="https://… (link a insertar)" style="flex:1;border:1px solid #e7e2f5;border-radius:9px;padding:8px 11px;font-size:12.5px;outline:none;"><button class="seg-ghost" data-sa="link-add" style="border:1px solid #e7e2f5;background:#fff;color:#5b3ad9;border-radius:9px;padding:8px 12px;font-size:12.5px;cursor:pointer;">Insertar link</button></div>'
      + '<div style="display:flex;gap:10px;margin-top:12px;align-items:center;">'
      + '<label style="border:1px solid #e7e2f5;background:#fff;color:#5b3ad9;border-radius:10px;padding:9px 13px;font-size:12.5px;cursor:pointer;">📎 Adjuntar<input id="opseg-attach" type="file" multiple style="display:none;"></label>'
      + '<button class="seg-primary" data-sa="send-reply" '+(state.sending?"disabled":"")+' style="margin-left:auto;border:none;background:'+(state.sending?"#555":"#141319")+';color:#fff;border-radius:10px;padding:11px 22px;font-size:14px;font-weight:600;cursor:'+(state.sending?"default":"pointer")+';">'+(state.sending?"Enviando…":"Enviar ahora")+'</button></div>'
      + (fus.length?'<div style="margin-top:14px;border-top:1px solid #f4f2fb;padding-top:12px;"><div style="font-size:11.5px;font-weight:600;color:#8b8699;margin-bottom:8px;">Follow-ups programados</div>'+fuList+'</div>':'')
      + '</div>'
      + '</div></div></div></div>'
      + fuModal;
  }
  function importSuggestions(){
    if(state.importing) return '<div style="padding:22px 14px;font-size:13px;font-weight:300;color:#5b3ad9;text-align:center;">Buscando en tu buzón por IMAP…</div>';
    var q=state.importQuery.trim();
    var valid=q.indexOf("@")!==-1 && q.indexOf(".")!==-1;
    if(!valid) return '<div style="padding:20px 14px;font-size:12.5px;font-weight:300;color:#a8a3b8;text-align:center;">Escribe el email completo de la persona y pulsa importar.</div>';
    return '<button class="seg-conv" data-sa="import-do" data-email="'+esc(q)+'" style="text-align:left;width:100%;border:none;background:#fbfaff;padding:13px 14px;cursor:pointer;display:flex;gap:11px;align-items:center;"><span style="width:34px;height:34px;flex:none;border-radius:9px;background:#f4f2ff;color:#5b3ad9;display:flex;align-items:center;justify-content:center;font-size:15px;">↓</span><span style="min-width:0;flex:1;font-size:13.5px;font-weight:500;color:#5b3ad9;">Importar conversación con «'+esc(q)+'»</span></button>';
  }
  function searchResultsHtml(){
    if(state.importing) return '<div style="padding:30px 16px;font-size:13px;color:#5b3ad9;text-align:center;">Importando conversación…</div>';
    if(state.searching) return '<div style="padding:30px 16px;font-size:13px;color:#5b3ad9;text-align:center;">Buscando en tu buzón…</div>';
    if(!state.searchResults.length) return (state.importQuery.trim()? '<div style="padding:24px 16px;font-size:12.5px;color:#a8a3b8;text-align:center;">Sin resultados. Prueba con otro término o sintaxis avanzada.</div>' : '');
    var boxes=state.searchBoxes.length?'<div style="font-size:11.5px;color:#12784a;padding:4px 4px 10px;">📁 Buscado en: '+esc(state.searchBoxes.join(", "))+'</div>':'';
    return boxes + state.searchResults.map(function(r){
      var d=new Date(r.last_date), ds=d.getDate()+"/"+(d.getMonth()+1)+"/"+d.getFullYear();
      return '<div style="border:1px solid #eef;background:#fbfaff;border-radius:12px;padding:13px 15px;margin-bottom:10px;">'
        + '<div style="display:flex;align-items:baseline;gap:10px;"><div style="font-size:14px;font-weight:600;color:#141319;flex:1;min-width:0;">'+esc(r.subject||"(sin asunto)")+'</div><div style="font-size:11.5px;color:#a8a3b8;white-space:nowrap;">'+ds+'</div></div>'
        + '<div style="font-size:12px;font-weight:300;color:#8b8699;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+esc(r.participants.join(", "))+' · '+r.count+' mensaje'+(r.count>1?"s":"")+'</div>'
        + '<button data-sa="import-do" data-email="'+esc(r.contact_email)+'" style="margin-top:8px;border:none;background:transparent;color:#2f6bd6;font-size:12.5px;font-weight:500;cursor:pointer;padding:0;">→ Click para importar a seguimientos</button>'
        + '</div>';
    }).join("");
  }
  function renderModal(){
    var host=document.getElementById("opseg-modal"); if(!host) return;
    if(!active||!state.importOpen){ host.innerHTML=""; return; }
    host.innerHTML=
      '<div data-sa="import-close" style="position:fixed;inset:0;z-index:110;background:rgba(20,19,25,0.4);display:flex;align-items:flex-start;justify-content:center;padding:8vh 16px;overflow:auto;">'
      + '<div style="width:100%;max-width:640px;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 30px 70px rgba(20,19,25,0.3);">'
      + '<div style="padding:20px 22px 14px;display:flex;align-items:flex-start;gap:12px;">'
      + '<div style="flex:1;"><div style="font-size:17px;font-weight:600;">Buscar en tu buzón</div>'
      + '<div style="font-size:12.5px;font-weight:300;color:#8b8699;margin-top:2px;">Busca en inbox + enviados. Click en un resultado para importarlo a seguimientos.</div></div>'
      + '<button data-sa="import-close" style="border:none;background:transparent;color:#8b8699;cursor:pointer;font-size:18px;">✕</button></div>'
      + '<div style="padding:0 22px;"><div style="display:flex;gap:10px;">'
      + '<input id="opseg-import-input" class="seg-in" data-sm="importQuery" value="'+esc(state.importQuery)+'" placeholder="nombre@empresa.com  ·  o  from:  to:  subject:  after:" style="flex:1;padding:12px 15px;border:1px solid #7a5af8;border-radius:11px;font-size:14px;outline:none;box-shadow:0 0 0 3px rgba(122,90,248,0.12);">'
      + '<button data-sa="search-do" '+(state.searching?"disabled":"")+' style="border:none;background:#141319;color:#fff;border-radius:11px;padding:12px 20px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;">'+(state.searching?"Buscando…":"Buscar")+'</button></div>'
      + '<div style="font-size:11.5px;color:#a8a3b8;margin:9px 2px 4px;line-height:1.5;">Tip: sintaxis avanzada — <code style="font-family:monospace;">from:juan@empresa.com</code>, <code style="font-family:monospace;">to:cliente@x.com</code>, <code style="font-family:monospace;">subject:propuesta</code>, <code style="font-family:monospace;">after:2026/01/01</code>. Para emails que TÚ enviaste usa <code style="font-family:monospace;">to:su_email</code>.</div></div>'
      + '<div class="seg-scroll" style="max-height:56vh;overflow:auto;padding:6px 22px 20px;">'+searchResultsHtml()+'</div>'
      + '</div></div>';
    var i=document.getElementById("opseg-import-input"); if(i){ var v=i.value; i.focus(); i.value=""; i.value=v; }
  }
  function renderToast(){
    var h=document.getElementById("opseg-toast"); if(!h) return;
    h.innerHTML=(active&&state.toast)?'<div style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:130;background:#141319;color:#fff;padding:13px 22px;border-radius:13px;font-size:14px;font-weight:300;box-shadow:0 18px 44px rgba(20,19,25,0.3);max-width:90vw;">'+esc(state.toast)+'</div>':"";
  }

  function render(){ attach(); ensureContainers(); renderInline(); renderDrawer(); renderModal(); renderToast(); saveSeg(); }

  return {
    mount:function(el){ mountEl=el; active=true; render(); if(!state._reco && getStoredConn()){ state._reco=true; reconnect().then(function(ok){ if(ok) render(); }); } },
    hide:function(){ active=false; var d=document.getElementById("opseg-drawer"); if(d) d.innerHTML=""; var mm=document.getElementById("opseg-modal"); if(mm) mm.innerHTML=""; var tt=document.getElementById("opseg-toast"); if(tt) tt.innerHTML=""; }
  };
})();
</script>
</body>
</html>
